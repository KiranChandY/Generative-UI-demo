<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found · Generative UI</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script>(function(){var t='dark';try{t=localStorage.getItem('gui-theme')||'dark'}catch(e){}document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')})();</script>
<style>
:root,[data-theme=dark]{--bg:#000000;--text:#EDEDED;--muted:#A1A1A1;--border:rgba(255,255,255,.14);--p:#EDEDED;--op:#000000;--g1:#FFFFFF;--g2:#9B9B9B}
[data-theme=light]{--bg:#FFFFFF;--text:#171717;--muted:#666666;--border:rgba(0,0,0,.1);--p:#171717;--op:#FFFFFF;--g1:#000000;--g2:#666666}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);font-family:'Geist',system-ui,sans-serif;text-align:center}
main{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:680px}
.code{font-size:14px;line-height:20px;font-weight:500;color:var(--muted);padding:2px 8px;border:1px solid var(--border);border-radius:9999px}
h1{font-size:48px;line-height:48px;font-weight:600;letter-spacing:-.02em;text-wrap:balance;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
p{font-size:16px;line-height:24px;color:var(--muted);text-wrap:pretty}
a{margin-top:8px;display:inline-flex;padding:8px 12px;border-radius:8px;background:var(--p);color:var(--op);font-size:16px;line-height:24px;font-weight:600;text-decoration:none;transition:opacity .3s cubic-bezier(.22,1,.36,1)}
a:hover{opacity:.86}a:focus-visible{outline:2px solid #0A72EF;outline-offset:2px}
</style></head>
<body><main><span class="code">404</span><h1>This page does not exist</h1><p>The link may be broken or the page may have moved. Head back and build something instead.</p><a href="/">Back to the builder</a></main></body></html>
